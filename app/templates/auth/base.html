<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#191C1D">
  <title>{% block title %}{% endblock %} · Blog Neo4j</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@600;700&family=IBM+Plex+Mono&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
  {% include "partials/reveal_head.html" %}
  <link rel="stylesheet" href="{{ url_for('static', filename='css/app.css') }}">
</head>
<body class="auth-body">
  <main class="auth-card panel">
    <div class="brand brand-dark">
      <span class="brand-mark" aria-hidden="true">{% include "partials/glyph.html" %}</span>
      <span><span class="brand-name">Blog</span><br><span class="brand-sub">Neo4j · {{ db_target }}</span></span>
    </div>
    {% include "partials/flash.html" %}
    {% if error %}<div class="notice notice-error" role="alert">{{ error }}</div>{% endif %}
    {% block content %}{% endblock %}
  </main>
  <script src="{{ url_for('static', filename='js/app.js') }}" defer></script>
</body>
</html>
