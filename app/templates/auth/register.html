{% extends "auth/base.html" %}
{% block title %}Crear cuenta{% endblock %}
{% block content %}
<h1 class="title">Crear cuenta</h1>
<form method="post" class="form">{{ csrf_field() }}
  <label>Nombre<input name="name" value="{{ form.name if form else '' }}" maxlength="80" required autofocus></label>
  <label>Correo<input type="email" name="email" value="{{ form.email if form else '' }}" autocomplete="username" required></label>
  <label>Contraseña<input type="password" name="password" minlength="8" autocomplete="new-password" required></label>
  <label>Repite la contraseña<input type="password" name="password_confirm" minlength="8" autocomplete="new-password" required></label>
  <button class="btn btn-primary" type="submit">Crear cuenta</button>
</form>
<p class="muted">¿Ya tienes cuenta? <a href="{{ url_for('auth.login') }}">Inicia sesión</a></p>
{% endblock %}
